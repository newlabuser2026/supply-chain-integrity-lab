name: Production Build and Keyless Sign
on:
  workflow_dispatch:

jobs:
  build-sign:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.3 

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2 

      - name: Login to GHCR
        uses: docker/login-action@v4.2.0 
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        id: build
        run: |
          IMAGE="ghcr.io/${{ github.repository }}"
          docker build -t $IMAGE:latest .
          docker push $IMAGE:latest
          echo "digest=$(docker inspect --format='{{index .RepoDigests 0}}' $IMAGE:latest)" >> $GITHUB_OUTPUT

      - name: Keyless Signing
        run: |
          cosign sign --yes ${{ steps.build.outputs.digest }}
